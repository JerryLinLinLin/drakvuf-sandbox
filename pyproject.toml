[project]
name = "drakvuf-sandbox"
version = "0.20.0"
description = "Automated malware analysis sandbox based on DRAKVUF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncvnc==1.3.0",
    "boto3==1.38.15",
    "click==8.1.7",
    "dataclasses-json==0.5.6",
    "drakpdb==0.2.2",
    "flare-capa==7.4.0",
    "flask==3.0.3",
    "flask-openapi3[swagger]==4.1.0",
    "msgpack==1.0.8",
    "mslex==1.1.0",
    "opencv-contrib-python-headless==4.11.0.86",
    "orjson==3.9.15",
    "pathvalidate==3.2.0",
    "perception==0.6.8",
    "pillow==10.4.0",
    "pydantic==2.10.6",
    "python-magic==0.4.27",
    "rq==2.3.1",
    "rq-dashboard==0.8.2.2",
    "tomli==2.2.1",
]

[tool.isort]
profile = "black"
skip_glob = ["drakrun/data/**/*", "drakrun/tools/**/*", "drakrun/web/frontend/**/*"]

[tool.black]
exclude = "drakrun/(data|tools|web/frontend)"

[tool.lint-python]
lint-version = "2"
source = "./drakrun"
use-mypy = false

[dependency-groups]
dev = [
    "setuptools>=80.10.2",
]
